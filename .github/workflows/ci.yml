name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # next build does not query the database (all data routes are dynamic and
      # render on request), but Prisma requires the variable to be present.
      DATABASE_URL: mongodb://localhost:27017/placeholder
      # Nothing in the build or the tests verifies a real session; this only
      # has to satisfy the length check so the module loads.
      SESSION_SECRET: ci-placeholder-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
